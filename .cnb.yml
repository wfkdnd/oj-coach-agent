$:
  vscode:
    - runner:
        cpus: 16
      docker:
        image: cnbcool/default-dev-env:latest
      env:
        VIRTUAL_ENV_DISABLE_PROMPT: "1"
        VIRTUAL_ENV: "/workspace/.venv"
        JAVA_HOME: "/usr/lib/jvm/default-java"
        PATH: "/workspace/.venv/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      services:
        - vscode
        - docker
      stages:
        - name: install system toolchains
          script: |
            cd /workspace
            set -e
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends build-essential default-jdk python3 python3-pip python3-venv python-is-python3
            else
              apt-get update
              apt-get install -y --no-install-recommends build-essential default-jdk python3 python3-pip python3-venv python-is-python3
            fi
            python --version
            python3 --version
            g++ --version
            java -version
            javac -version
        - name: uv sync
          script: |
            cd /workspace
            uv sync --all-packages
            uv run python -c "import tiktoken"
            python3 --version
            g++ --version
            java -version
            javac -version
