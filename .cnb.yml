$:
  vscode:
    - runner:
        cpus: 16
      docker:
        image: cnbcool/default-dev-env:latest
      env:
        VIRTUAL_ENV_DISABLE_PROMPT: "1"
        VIRTUAL_ENV: "/workspace/.venv"
        JAVA_HOME: "/usr/lib/jvm/java-17-openjdk-amd64"
        PATH: "/workspace/.local/bin:/workspace/.venv/bin:/root/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        CNB_WELCOME_CMD: "cd /workspace && bash .cnb/setup-dev-tools.sh"
      services:
        - vscode
        - docker
      stages:
        - name: install system toolchains
          script: |
            cd /workspace
            bash .cnb/setup-dev-tools.sh
        - name: uv sync
          script: |
            cd /workspace
            uv sync --all-packages
            uv run python -c "import tiktoken"
            python3 --version
            g++ --version
            java -version
            javac -version
