[project]
name = "agent-app"
version = "0.1.0"
description = "基于通用底盘搭建的 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich>=15.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
# 改成你自己的命令名；右侧包名需与 src/ 下目录一致
agent-app = "agent_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_app"]

[tool.uv]
package = true
